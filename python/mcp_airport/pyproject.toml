[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-airport"
version = "0.1.0"
description = "MCP server with an airport_info tool backed by Wikipedia"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=2.0.0,<3",
    "fastmcp>=4.0.0,<5",
    "httpx>=0.27",
]

[project.scripts]
start-airport-server = "mcp_airport.app:main"

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
